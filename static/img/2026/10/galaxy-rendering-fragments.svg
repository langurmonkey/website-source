<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="frag-title">
<title id="frag-title">The box as a vessel for pixels. Its front faces are culled, so the near wall is never drawn: each pixel the box covers receives exactly one fragment on its far wall, and the shader reads that fragment's world position as a ray direction from the camera. Because the near wall is not drawn, the camera can also sit inside the box and every pixel still receives a fragment.</title>
<defs>
<radialGradient id="gal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f9dfb2" stop-opacity="1"/><stop offset="0.10" stop-color="#f0b45c" stop-opacity="0.95"/><stop offset="0.26" stop-color="#e08a1e" stop-opacity="0.72"/><stop offset="0.50" stop-color="#d6317f" stop-opacity="0.36"/><stop offset="0.74" stop-color="#1a8fd1" stop-opacity="0.16"/><stop offset="1" stop-color="#1a8fd1" stop-opacity="0"/></radialGradient>
</defs>
<rect width="900" height="480" fill="#ffffff"/>
<rect x="30" y="66" width="500" height="380" rx="12" fill="#ffffff" stroke="#e3e3e5"/>
<rect x="550" y="66" width="320" height="380" rx="12" fill="#ffffff" stroke="#e3e3e5"/>
<text x="30" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#1d1d1f" text-anchor="start">a box that is all pixels and no surfaces</text>
<text x="30" y="53" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#8a8a8e" text-anchor="start">front faces are culled, so the box covers the screen with fragments, not with surfaces</text>
<rect x="264.5" y="103.6" width="200.0" height="160.0" fill="#f7f7f8" stroke="#c9c9cd" stroke-width="1.2"/>
<rect x="234.5" y="126.6" width="200.0" height="160.0" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="234.5,126.6 264.5,103.6 464.5,103.6 434.5,126.6" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="434.5,126.6 464.5,103.6 464.5,263.6 434.5,286.6" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="234.5" y1="286.6" x2="264.5" y2="263.6" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<ellipse cx="349.5" cy="204" rx="85" ry="13" fill="url(#gal)"/>
<rect x="150.5" y="295.7" width="60.0" height="57.0" fill="#ffffff" stroke="#c9c9cd" stroke-width="1.2"/>
<line x1="170.5" y1="295.7" x2="170.5" y2="352.7" stroke="#3a3a40" stroke-opacity="0.18" stroke-width="1"/>
<line x1="190.5" y1="295.7" x2="190.5" y2="352.7" stroke="#3a3a40" stroke-opacity="0.18" stroke-width="1"/>
<line x1="150.5" y1="314.7" x2="210.5" y2="314.7" stroke="#3a3a40" stroke-opacity="0.18" stroke-width="1"/>
<line x1="150.5" y1="333.7" x2="210.5" y2="333.7" stroke="#3a3a40" stroke-opacity="0.18" stroke-width="1"/>
<rect x="150.5" y="295.7" width="20.0" height="19.0" fill="#1a8fd1" fill-opacity="0.16"/>
<rect x="170.5" y="314.7" width="20.0" height="19.0" fill="#1a8fd1" fill-opacity="0.16"/>
<rect x="190.5" y="333.7" width="20.0" height="19.0" fill="#1a8fd1" fill-opacity="0.16"/>
<g transform="translate(76.0,404.0) rotate(-37.37)">
<rect x="-45" y="-11" width="34" height="22" rx="3" fill="#ffffff" stroke="#3a3a40" stroke-width="1.2"/>
<polygon points="-11,-6.5 0,-12 0,12 -11,6.5" fill="#3a3a40"/>
</g>
<circle cx="76.0" cy="404.0" r="2.0" fill="#ffffff"/>
<line x1="76.0" y1="404.0" x2="309.5" y2="131.0" stroke="#3a3a40" stroke-opacity="0.65" stroke-width="1.1"/>
<circle cx="160.5" cy="305.2" r="2.2" fill="#3a3a40"/>
<circle cx="309.5" cy="131.0" r="4.4" fill="#ffffff"/>
<circle cx="309.5" cy="131.0" r="2.4" fill="#1d1d1f"/>
<line x1="76.0" y1="404.0" x2="364.8" y2="183.5" stroke="#3a3a40" stroke-opacity="0.65" stroke-width="1.1"/>
<circle cx="180.5" cy="324.2" r="2.2" fill="#3a3a40"/>
<circle cx="364.8" cy="183.5" r="4.4" fill="#ffffff"/>
<circle cx="364.8" cy="183.5" r="2.4" fill="#1d1d1f"/>
<line x1="76.0" y1="404.0" x2="420.0" y2="236.0" stroke="#3a3a40" stroke-opacity="0.65" stroke-width="1.1"/>
<circle cx="200.5" cy="343.2" r="2.2" fill="#3a3a40"/>
<circle cx="420.0" cy="236.0" r="4.4" fill="#ffffff"/>
<circle cx="420.0" cy="236.0" r="2.4" fill="#1d1d1f"/>
<text x="84" y="437" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">camera</text>
<text x="148" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">the screen</text>
<text x="152" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">one pixel, one ray</text>
<text x="392" y="256" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#8a8a8e" text-anchor="start">one fragment</text>
<rect x="300" y="392" width="16" height="16" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="326" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">front faces: culled, no fragment</text>
<rect x="300" y="416" width="16" height="16" fill="#f7f7f8" stroke="#c9c9cd" stroke-width="1.2"/>
<text x="326" y="428" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">back faces: drawn, one per pixel</text>
<text x="566" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#8a8a8e" text-anchor="start">FROM THE INSIDE</text>
<rect x="630" y="177" width="160" height="130" fill="#f7f7f8" stroke="#c9c9cd" stroke-width="1.2"/>
<rect x="600" y="200" width="160" height="130" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="600,200 630,177 790,177 760,200" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="760,200 790,177 790,307 760,330" fill="none" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="600" y1="330" x2="630" y2="307" stroke="#c9c9cd" stroke-width="1.2" stroke-dasharray="4 4"/>
<ellipse cx="695" cy="250" rx="55" ry="9" fill="url(#gal)"/>
<g transform="translate(660.0,290.0) rotate(-52.16)">
<rect x="-36" y="-8" width="26" height="16" rx="3" fill="#ffffff" stroke="#3a3a40" stroke-width="1.2"/>
<polygon points="-10,-5 0,-9 0,9 -10,5" fill="#3a3a40"/>
</g>
<circle cx="660.0" cy="290.0" r="2.0" fill="#ffffff"/>
<line x1="660.0" y1="290.0" x2="662.0" y2="196.0" stroke="#3a3a40" stroke-opacity="0.45" stroke-width="1"/>
<circle cx="662.0" cy="196.0" r="2.3" fill="#1d1d1f"/>
<line x1="660.0" y1="290.0" x2="730.0" y2="186.0" stroke="#3a3a40" stroke-opacity="0.45" stroke-width="1"/>
<circle cx="730.0" cy="186.0" r="2.3" fill="#1d1d1f"/>
<line x1="660.0" y1="290.0" x2="776.0" y2="246.0" stroke="#3a3a40" stroke-opacity="0.45" stroke-width="1"/>
<circle cx="776.0" cy="246.0" r="2.3" fill="#1d1d1f"/>
<text x="566" y="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">the camera can sit inside the box;</text>
<text x="566" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">the far wall is still the one drawn,</text>
<text x="566" y="428" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8e" text-anchor="start">so the screen stays full</text>
</svg>
